name: CI

on: [push, workflow_dispatch]

jobs:
  build:
    # Use macOS for the "real" build to avoid the ABI/crashing issues
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive # Important if the tweak has dependencies

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Build package
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations"
        
      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: LiquidAss-Rootless-Build
          path: packages/*.deb
